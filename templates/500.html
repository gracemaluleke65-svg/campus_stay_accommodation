{% extends "base.html" %}

{% block title %}Server Error - CampusStay{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center">
            <i class="fa fa-exclamation-triangle text-danger" style="font-size: 5rem;"></i>
            <h1 class="mt-4" style="font-size: 4rem; font-weight: 700; color: var(--dark);">500</h1>
            <h2 class="mb-3" style="font-family: 'Montserrat', sans-serif;">Server Error</h2>
            <p class="lead mb-4">Oops! Something went wrong on our end. Please try again later.</p>
            <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg">
                <i class="fa fa-home me-2"></i>Back to Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
